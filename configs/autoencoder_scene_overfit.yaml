# Autoencoder configuration for single-chunk overfitting.

model:
  base_ch: 128
  n_down: 3
  codebook_size: 4096
  use_sh: false
  use_generative_transpose: false

data:
  cache_root: "/home/chengtianle/baiyiyang/GaussianGPT/data/cache/ASE_overfit"
  base_voxel_size: 0.025
  chunk_size: [256, 256, 256]
  fixed_chunk: true
  train_samples_per_epoch: 1000
  val_samples_per_epoch: 1

  min_occupancy_ae: 0.2
  max_candidate_chunks: 10
  z_mode: "fixed_160"

  num_workers: 0
  val_num_workers: 0
  pin_memory: false

  seed: 42

loss:
  lambda_rgb: 7.5
  lambda_perc: 0.3
  lambda_occ: 1.0
  lambda_lfq: 0.1

  n_images: 12
  render_size: 512
  perceptual_batch_size: 12
  vgg19_weights_path: "/home/chengtianle/baiyiyang/GaussianGPT/checkpoints/vgg19-dcbb9e9d.pth"

validation:
  gt_prune: false
  occ_head_prune: false

camera_sampling:
  mode: "scoring"

training:
  generative_train_prune_with_gt: true  # Only used when model.use_generative_transpose is true.
  epochs: 6000
  batch_size: 1
  lr: 1.0e-4
  save_every: 1500
  val_every_steps: 1000

diagnostics:
  color_check_every: 100

debug:
  no_augment: true
  voxel_dedup: "nearest"
  grad_clip: 1000.0
  occ_check_every: 100
  log_grad_norm_every: 20
